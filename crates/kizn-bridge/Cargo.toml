[package]
name = "kizn-bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
axum = "0.8.9"
futures-util = "0.3.34"
kizn-app = { path = "../kizn-app" }
kizn-core = { path = "../kizn-core" }
kizn-model = { path = "../kizn-model", features = ["fake"] }
kizn-store = { path = "../kizn-store" }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }

[features]
# Test-only commands (clock, mock scripting) for the @ui layer. Never in a shipped build.
test = []
