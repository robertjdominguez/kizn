# On a v* tag (pushed by `just release`): build the three bundles, run the
# @install scenarios against them, collect them under the stable names the
# install scripts expect, write VERSION and SHA256SUMS, and create a DRAFT
# GitHub release (a prerelease if the version has a "-"). Publishing is by
# hand. Unsigned (macOS is ad-hoc signed). No model is called.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-22.04
          - os: macos-14
            args: --target universal-apple-darwin
          - os: windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: The tag matches the app's version
        shell: bash
        run: |
          want="${GITHUB_REF_NAME#v}"
          have=$(sed -n 's/^  "version": "\(.*\)",$/\1/p' src-tauri/tauri.conf.json)
          [[ "$want" == "$have" ]] || { echo "tag $GITHUB_REF_NAME, but tauri.conf.json says $have"; exit 1; }
      - name: macOS universal targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Bundle
        shell: bash
        # `just bundle` skips .rpm and .msi for prereleases.
        run: just bundle ${{ matrix.args }}
      - run: just release-assets dist
      - name: Install scenarios against these bundles
        shell: bash
        run: KIZN_STAGE_ASSETS="$(pwd -W 2>/dev/null || pwd)/dist" just install-test
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  draft:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - run: just release-sums dist
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""; [[ "$GITHUB_REF_NAME" == *-* ]] && pre="--prerelease"
          gh release create "$GITHUB_REF_NAME" dist/* --draft $pre --verify-tag \
            --title "kizn ${GITHUB_REF_NAME}" \
            --notes "Install: see https://kizn.app. Unsigned builds: the install scripts avoid OS warnings; browser downloads may show them."
