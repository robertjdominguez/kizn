# Lint, tests and both BDD layers on three OSes; @smoke in the real webview
# on Linux and Windows; unsigned installers as run artifacts. Every job calls
# `just`, so CI runs the same commands as a contributor. No job has a model
# key or reaches a model endpoint.

name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: just lint
      - name: Generated TS types are current
        run: just types && git diff --exit-code -- ui/src/bindings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Playwright Chromium
        working-directory: tests/ui
        run: bunx playwright install --with-deps chromium
      - run: just test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.os }}
          path: tests/ui/playwright-report
          if-no-files-found: ignore

  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: WebKitWebDriver and Xvfb
        if: runner.os == 'Linux'
        run: sudo apt-get install -y webkit2gtk-driver xvfb
      - name: tauri-driver
        run: cargo install tauri-driver --locked
      # The driver must match the WebView2 runtime the app runs in, not the
      # Edge browser (they're versioned separately on the runners).
      - name: msedgedriver matching the WebView2 runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $version = (Get-ItemProperty -Path $key).pv
          Write-Host "WebView2 runtime $version"
          $dir = Join-Path $env:RUNNER_TEMP 'msedgedriver'
          Invoke-WebRequest "https://msedgedriver.microsoft.com/$version/edgedriver_win64.zip" -OutFile "$dir.zip"
          Expand-Archive "$dir.zip" -DestinationPath $dir
          Add-Content $env:GITHUB_PATH $dir
      - run: just smoke

  bundle:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: just bundle
      - run: just release-assets dist
      - name: Install scenarios against these bundles
        shell: bash
        run: KIZN_STAGE_ASSETS="$(pwd -W 2>/dev/null || pwd)/dist" just install-test
      - uses: actions/upload-artifact@v4
        with:
          name: kizn-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error
