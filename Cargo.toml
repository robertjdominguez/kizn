[workspace]
resolver = "3"
members = ["crates/*", "src-tauri", "tests/domain", "tests/install"]
default-members = ["crates/*", "tests/domain", "tests/install"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.98"
license = "AGPL-3.0-or-later"
repository = "https://github.com/robertjdominguez/kizn"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
